name: Build and report progress

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # lets you trigger a run by hand from the Actions tab

jobs:
  build-and-report:
    runs-on: [self-hosted, windows, ps2-toolchain]

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Build frontbin
        shell: pwsh
        run: |
          & "C:\tools\eegcc_2.95.3_sn_v1.36\bin\make.exe" *> build_log.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content build_log.txt
            throw "make.exe failed (exit $LASTEXITCODE) -- see build_log.txt above"
          }

      - name: Upload build log (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build_log
          path: build_log.txt
          
      - name: Install objdiff-cli
        shell: pwsh
        run: |
          cargo install objdiff-cli --locked
          # If the runner doesn't have Rust/cargo, swap this for
          # downloading a prebuilt objdiff-cli release binary instead --
          # see https://github.com/encounter/objdiff/releases

      - name: Generate progress report
        shell: pwsh
        run: |
          objdiff-cli report generate -o build/report.json

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: v1_report
          path: build/report.json
