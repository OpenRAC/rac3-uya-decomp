name: Sync wiki

# Copies docs/wiki/*.md to the GitHub wiki after they change on main, so the
# wiki is reviewed through pull requests like everything else.
# One-time setup: enable the wiki in the repo settings and create any first
# page by hand (GitHub only creates the wiki's git repo after that).
# Runs on a GitHub-hosted runner: it needs no toolchain or retail files.

on:
  push:
    branches: [main]
    paths: ["docs/wiki/**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push docs/wiki to the wiki repo
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          rsync -a --delete --exclude .git docs/wiki/ wiki/
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
          else
            git commit -m "Sync wiki from ${GITHUB_SHA::7}"
            git push
          fi
