<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>localdecomp</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <button id="sidebar-toggle-btn" title="Toggle function list">&#9776;</button>
    <h1>localdecomp</h1>
    <button id="build-btn">Build &amp; Diff (Ctrl+Enter)</button>
    <button id="save-btn">Save to project</button>
    <select id="profile-select" hidden title="Shared level code: the compiler profile to build with (mode N = -mno-split-addresses, S = split; assembler default or Ps2EeAs). Auto tries the catalogue's entry, then all four, and keeps the best.">
      <option value="auto">Profile: auto</option>
      <option value="N/default">N / default as</option>
      <option value="S/default">S / default as</option>
      <option value="S/ps2as">S / ps2as</option>
      <option value="N/ps2as">N / ps2as</option>
    </select>
    <button id="export-diff-btn" disabled>Export diff</button>
    <button id="permuter-btn" title="Random search for a closer variant of the editor's code (decomp-permuter), with live progress">Permuter</button>
    <button id="check-btn" title="Full build + MATCH + full objdiff report, compared with your last push">Full check</button>
    <button id="push-btn" disabled title="Unlocks after a passing full check of the current commit">Push</button>
    <span id="status"></span>
  </header>

  <div id="progress-bar">
    <div id="progress-fill"></div>
    <div id="progress-label"></div>
  </div>

  <main>
    <aside id="func-sidebar">
      <div class="pane-title target-title">
        <select id="target-select" title="Which executable's functions to list (each splatted ELF has its own list, editor and progress bar)">
          <option value="frontbin">frontbin</option>
        </select>
      </div>
      <input id="sidebar-filter" type="text" placeholder="Filter..." autocomplete="off">
      <div id="sidebar-list"></div>
    </aside>

    <section id="editor-pane">
      <div class="pane-title">C source</div>
      <div id="editor-wrap">
        <pre id="c-highlight" aria-hidden="true"><code id="c-highlight-code"></code></pre>
        <textarea id="c-editor" spellcheck="false"></textarea>
      </div>
    </section>

    <section id="diff-pane">
      <div class="pane-title diff-pane-title">
        <span>Diff (target vs current)</span>
        <span id="score-badge" class="score-badge">no build yet</span>
      </div>
      <div id="diff-view"><div class="empty-hint">Pick a function and click Build.</div></div>
    </section>
  </main>

  <section id="perm-panel" hidden>
    <div class="perm-head">
      <span class="perm-title">Permuter</span>
      <span id="perm-func"></span>
      <select id="perm-search" title="Random: decomp-permuter's random rewrites, until stopped. Exhaustive: every empty-asm fence, volatile barrier, do-while wrap and statement swap, then pairs of the best (tools/fence_search.py); finishes on its own.">
        <option value="random">Random search</option>
        <option value="exhaustive">Every fence &amp; barrier</option>
      </select>
      <label title="Worker processes; each compiles one candidate at a time">Workers <input id="perm-jobs" type="number" min="1" max="64"></label>
      <label title="Stop after this many minutes (0 = until stopped or matched)">Minutes <input id="perm-mins" type="number" min="0" value="10"></label>
      <label title="Also try empty register fences and volatile barriers (inline asm; commits that use them need the (asm) tag)"><input id="perm-asm" type="checkbox" checked> Fence/barrier passes</label>
      <button id="perm-start" disabled>Start from editor code</button>
      <button id="perm-stop" disabled>Stop</button>
      <span id="perm-state" class="score-badge">idle</span>
      <span id="perm-note" class="perm-note"></span>
      <button id="perm-close" title="Hide (the run keeps going)">&times;</button>
    </div>
    <div id="perm-stats"></div>
    <div class="perm-body">
      <div class="perm-col">
        <div class="perm-sub">Aligned diffs over time <span class="perm-key"><i class="k-best"></i>best <i class="k-dot"></i>candidates <i class="k-base"></i>base</span></div>
        <svg id="perm-chart" preserveAspectRatio="none"></svg>
        <div class="perm-sub">Passes</div>
        <div class="perm-scroll"><table id="perm-passes"></table></div>
      </div>
      <div class="perm-col">
        <div class="perm-sub">Activity (newest first)</div>
        <div id="perm-feed" class="perm-scroll"></div>
      </div>
      <div class="perm-col wide">
        <div class="perm-sub">Results</div>
        <div id="perm-results" class="perm-scroll short"></div>
        <div id="perm-output" class="perm-scroll"></div>
      </div>
    </div>
  </section>

  <div id="check-panel" hidden>
    <div id="check-card">
      <div class="check-head">
        <span id="check-title">Full check</span>
        <button id="check-close" title="Close">&times;</button>
      </div>
      <div id="check-body"></div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script src="/permuter.js"></script>
</body>
</html>
